<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Donate — CSP</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>CSP — Donate</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/ngos.html">NGOs</a>
      <a href="/donate.html">Donate</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <section>
      <h2>Make a Donation</h2>
      <form id="donationForm">
        <label>
          Your name
          <input type="text" id="donorName" required>
        </label>
        <label>
          Email
          <input type="email" id="donorEmail" required>
        </label>
        <label>
          Select NGO
          <select id="ngoSelect"></select>
        </label>
        <label>
          Amount (INR)
          <input type="number" id="amount" min="1" required>
        </label>
        <button class="btn" type="submit">Donate</button>
      </form>
      <div id="donationMsg" class="message"></div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; CSP</p>
  </footer>
</body>
</html>
